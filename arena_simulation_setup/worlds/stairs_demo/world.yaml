format: arena-world/2
layout: stacked
defaults:
  ceiling: false
levels:
- id: '0'
  zones:
  - {name: lobby, polygon: [[0, 0], [20, 0], [20, 10], [0, 10]], floor: Marble}
  walls:
  - {path: [[0, 0], [20, 0], [20, 10], [0, 10]], closed: true}
  stairs:
  - name: stairs
    kind: stairs
    mouth: [6.0, 2.0]
    size: [5.2, 2.0]
    to: '1'
    material: Oak_Planks
    surfaces: {risers: Paint_Matte, fixture: Plaster_Wall}
    sides:
      left: {kind: balustrade}
      right: {material: Plaster_Wall}
    rails:
    - {across: left, kind: handrail}
    - {across: right, kind: handrail}
    - {across: 0.0, kind: handrail, solid: true}
  escalators:
  - {name: esc_up, kind: belt_escalator, mouth: [2.0, 5.0], size: [14.0, 1.0], to: '1'}
  - {name: esc_down, kind: escalator, mouth: [6.0, 7.2], size: [6.8, 1.0], to: '1', direction: down}
- id: '1'
  elevation: 3.0
  zones:
  - {name: gallery, polygon: [[0, 0], [20, 0], [20, 10], [0, 10]], floor: Marble}
  walls:
  - {path: [[0, 0], [20, 0], [20, 10], [0, 10]], closed: true}
