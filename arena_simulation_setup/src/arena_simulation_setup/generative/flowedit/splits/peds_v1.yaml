# PEDS runs over FLOWEDIT edits: train, held-out edits and held-out worlds. `flowedit sweep` records every run (see split.py).
#
# Each base world's edits come from `flowedit generate <base> --scenario <scenario> --seed <seed> --per-type <per_type>`,
# one chain per edit type and index, in the generator's order (move, insert, remove, function, access, layout).
#   train           hospital_1 itself and chains 1-2 of every edit type
#   held_out_edits  chain 3 of every edit type on hospital_1: edit types seen in train, at other targets and values
#   held_out_worlds office_1 and chain 1 of every edit type on it: no run of office_1 is in train
# Only hospital_1 (queue) and office_1 (default) ship a scenario with a need-satisfying object; generated layouts have none.
format: flowedit-split/1
sources:
  hospital_1: {scenario: queue, seed: 0, per_type: 3, steps: 1}
  office_1: {scenario: default, seed: 0, per_type: 1, steps: 1}
duration: 300
seeds: [0]
partitions:
  train:
    - hospital_1
    - hospital_1__move_fountain__6e1d6873
    - hospital_1__move_fountain__667253ac
    - hospital_1__insert_gen_sm_waterdispenser_01a_1__ea26097f
    - hospital_1__insert_gen_sm_waterdispenser_01a_1__1e59d925
    - hospital_1__remove_fountain__6ed0b4ea
    - hospital_1__remove_waiting_sofa_3__920f4b7c
    - hospital_1__function_fountain__638f0641
    - hospital_1__function_fountain__efd48775
    - hospital_1__access_patient_ward_door_2__c485e3a4
    - hospital_1__access_patient_ward_door_1__d24b53b6
    - hospital_1__layout_move_wc_waiting_stall_3_door__54fbb0eb
    - hospital_1__layout_move_doctors_resting_room_door__5af68761
  held_out_edits:
    - hospital_1__move_fountain__6a2c296b
    - hospital_1__insert_gen_sm_waterdispenser_01a_1__4d2a96ff
    - hospital_1__remove_wc_pharmacy_toilet_paper_2__c4bd8e8b
    - hospital_1__function_fountain__daff8b6d
    - hospital_1__access_fire_alarm__8866ca6d
    - hospital_1__layout_add_gen_door_1__71e5baec
  held_out_worlds:
    - office_1
    - office_1__move_fountain__2af43765
    - office_1__insert_gen_water_cooler_1__bed8a70e
    - office_1__remove_fountain__3578b71c
    - office_1__function_fountain__63b53335
    - office_1__access_reception_to_hallway_2__44c89ba8
    - office_1__layout_move_meeting_1_to_sub_hallway__05d4edbd
# Crowd settings (crowds/*.yaml) and where each runs. train is the defaults; every test crowd differs from it in need
# rates, crowd size or local planner, and runs on the held-out edits only.
crowds:
  train: {settings: crowds/train.yaml, partitions: [train, held_out_edits, held_out_worlds]}
  test_rates: {settings: crowds/test_rates.yaml, partitions: [held_out_edits]}
  test_size: {settings: crowds/test_size.yaml, partitions: [held_out_edits]}
  test_orca: {settings: crowds/test_orca.yaml, partitions: [held_out_edits]}
  test_hsfm: {settings: crowds/test_hsfm.yaml, partitions: [held_out_edits]}
  test_all: {settings: crowds/test_all.yaml, partitions: [held_out_edits]}
