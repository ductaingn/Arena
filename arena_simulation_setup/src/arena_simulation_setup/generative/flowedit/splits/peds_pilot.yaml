# PEDS pilot runs over FLOWEDIT edits: train, held-out edits and held-out worlds. `flowedit sweep` records every run (see split.py).
#
# A pilot, smaller than the study design's split (FLOWEDIT study design §5: 20 chains per edit type, office_1 in train,
# reception held out). Each base world's edits come from `flowedit generate <base> --scenario <scenario> --seed <seed>
# --per-type <per_type> --controls`, one chain per edit type and index, in the generator's order (move, insert, remove,
# function, access, layout); a function-carrying move or insert lists its geometry-only controls right after it.
#   train           hospital_1 itself, chains 1-2 of every edit type and their controls, crowd seeds 1-5
#   held_out_edits  chain 3 of every edit type on hospital_1 and its controls, seeds 6-8; hospital_1 runs at 6-8 as their reference
#   held_out_worlds office_1, chain 1 of every edit type on it and its controls, seeds 6-8: no run of office_1 is in train
# Only hospital_1 (queue) and office_1 (default) ship a scenario with a need-satisfying object; generated layouts have none.
format: flowedit-split/1
sources:
  hospital_1: {scenario: queue, seed: 0, per_type: 3, steps: 1, controls: true}
  office_1: {scenario: default, seed: 0, per_type: 1, steps: 1, controls: true}
duration: 300
# no door entrances: HumanSim despawns a released visitor once it is inside its sink, and the reader's sink strip lies
# right in front of the source, so visitors vanish within a second on their way in. Only the reader's placed people run.
settings:
  entrances: {rate: 0}
seeds:
  train: [1, 2, 3, 4, 5]
  held_out_edits: [6, 7, 8]
  held_out_worlds: [6, 7, 8]
partitions:
  train:
    - hospital_1
    - hospital_1__move_fountain__6e1d6873
    - hospital_1__insert_fountain_inert__4a32a4fc
    - hospital_1__move_fountain_leave_demand__66723c25
