# Package "flow": what each object is for (its demand), the FLOWEDIT graph, loaded on demand
name = "flow"
version = 1
requires = ["core"]

[nodes.service]
props = []
auto = true
propless = true

[nodes.need]
props = []
auto = true
propless = true

[nodes.formation]
props = []
auto = true
propless = true

# a HumanSim interaction kind (USE, QUEUE_USE, SIT_ON, LIE_ON, GROUP_CONVERSATION, ...)
[nodes.interaction]
props = []
auto = true
propless = true

[verbs.at]
from = ["obj"]
to = ["floor"]

[verbs.serves]
from = ["obj"]
to = ["service"]

[verbs.satisfies]
from = ["obj"]
to = ["need"]

[verbs.has_formation]
from = ["obj"]
to = ["formation"]

# how a person uses the object: object-bound kinds run at it, `meet: true` kinds run beside it after a go_to
[verbs.affords]
from = ["obj"]
to = ["interaction"]

[verbs.dwells]
from = ["obj"]
to = "literal"
