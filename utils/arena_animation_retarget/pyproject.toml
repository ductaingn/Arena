[project]
name = "arena_animation_retarget"
version = "0.0.0"
dependencies = [
    "numpy",
    "scipy",
    "pyyaml",
    "torch",
]
dynamic = ["description", "license", "maintainers", "scripts"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
